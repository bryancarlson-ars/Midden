name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve and validate version
        id: version
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          COMMIT_IDENTIFIER: ${{ github.sha }}
        run: |
          [xml] $buildProperties = Get-Content Directory.Build.props
          $versionPrefix = [string] $buildProperties.Project.PropertyGroup.VersionPrefix
          $prereleaseChannel = [string] $buildProperties.Project.PropertyGroup.PrereleaseChannel

          $isRelease = $env:REF_TYPE -eq 'tag'
          if ($isRelease) {
              $version = $env:REF_NAME.Substring(1)
          } else {
              $channel = if ($prereleaseChannel) { $prereleaseChannel } else { 'dev' }
              $version = "$versionPrefix-$channel.$env:COMMIT_IDENTIFIER"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

  build_and_deploy_job:
    needs: metadata
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish Blazor WebAssembly App
        run: dotnet publish Caf.Midden.Wasm/Caf.Midden.Wasm.csproj -c Release -p:Version=${{ needs.metadata.outputs.version }}

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DELIGHTFUL_GRASS_0EAAA8E1E }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "Caf.Midden.Wasm/bin/Release/net10.0/publish/wwwroot"
          skip_app_build: true
          skip_api_build: true
          production_branch: main

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DELIGHTFUL_GRASS_0EAAA8E1E }}
          action: "close"
